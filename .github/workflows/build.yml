name: Build Project XYZ

on:
  workflow_dispatch:

jobs:

  # =========================
  # WINDOWS
  # =========================
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Windows app
        run: npm run build:win

      - name: Show Windows build files
        shell: powershell
        run: |
          Write-Host "=== DIST CONTENTS ==="
          Get-ChildItem -Path dist -Recurse | Select-Object FullName, Length

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error


  # =========================
  # ANDROID
  # =========================
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Add Android
        run: npx cap add android

      - name: Generate Android assets
        run: npx capacitor-assets generate --android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Android APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Copy APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ProjectXYZ.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: ProjectXYZ.apk
          if-no-files-found: error


  # =========================
  # IOS - UNSIGNED
  # =========================
  ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Add iOS
        run: npx cap add ios

      - name: Generate iOS assets
        run: npx capacitor-assets generate --ios

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Check iOS project
        run: |
          echo "=== Checking iOS project ==="
          test -d "ios/App/App.xcworkspace"
          echo "App.xcworkspace found"

      - name: Build unsigned iOS app
        run: |
          rm -rf build

          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Check unsigned App
        run: |
          echo "=== Searching for App.app ==="
          find build -type d -name "App.app" -print

          test -d "build/Build/Products/Release-iphoneos/App.app"

      - name: Package unsigned IPA
        run: |
          rm -rf Payload
          mkdir -p Payload

          cp -R \
            "build/Build/Products/Release-iphoneos/App.app" \
            "Payload/App.app"

          rm -f ProjectXYZ-unsigned.ipa

          cd Payload
          zip -r "../ProjectXYZ-unsigned.ipa" App.app

          cd ..

          echo "=== Created IPA ==="
          ls -lh ProjectXYZ-unsigned.ipa

      - name: Verify IPA
        run: |
          echo "=== IPA CONTENTS ==="
          unzip -l ProjectXYZ-unsigned.ipa

          echo "=== Checking Payload/App.app ==="
          unzip -l ProjectXYZ-unsigned.ipa | grep "Payload/App.app/"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios
          path: ProjectXYZ-unsigned.ipa
          if-no-files-found: error


  # =========================
  # RELEASE
  # =========================
  release:
    needs: [windows, android, ios]

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download all builds
        uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true

      - name: Show release files
        run: |
          echo "=== RELEASE FILES ==="
          find files -type f -maxdepth 3 -print

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Project XYZ v1.0.${{ github.run_number }}
          files: files/*
